openapi: 3.1.0
info:
  title: Evenemangsbokning – mock-API
  version: 1.0.0
  description: >
    Mockat API för kodtestet. Alla fel returneras som application/problem+json (RFC 9457)
    med en maskinläsbar `code`. Med chaos mode påslaget kan vilket anrop som helst bli
    fördröjt, svara 503 med Retry-After eller misslyckas med ett nätverksfel.
paths:
  /api/events:
    get:
      summary: Lista kommande evenemang
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Sök på namn eller ort }
        - { name: hasFreeSeats, in: query, schema: { type: boolean }, description: Bara evenemang med lediga platser }
        - { name: includePast, in: query, schema: { type: boolean, default: false }, description: Ta med evenemang som redan har startat }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - $ref: '#/components/parameters/Chaos'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EventList' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/events/{id}:
    get:
      summary: Hämta ett evenemang
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: evt-1 }
        - $ref: '#/components/parameters/Chaos'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/events/{id}/bookings:
    post:
      summary: Boka platser
      description: >
        Ryms bokningen blir den bekräftad, annars hamnar hela bokningen på väntelistan.
        Skicka en Idempotency-Key för att kunna göra om anropet säkert: samma nyckel med
        samma innehåll ger samma svar igen, med headern Idempotent-Replayed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: evt-1 }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
        - $ref: '#/components/parameters/Chaos'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateBookingRequest' } } }
      responses:
        '201':
          description: Bokningen är skapad, bekräftad eller väntande
          headers: { Location: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/bookings/{id}:
    get:
      summary: Hämta en bokning
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: bkg-1 }
        - $ref: '#/components/parameters/Chaos'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      summary: Avboka
      description: Tillåtet fram till 48 timmar före start. Frigjorda platser går till väntelistan.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: bkg-1 }
        - $ref: '#/components/parameters/Chaos'
      responses:
        '204': { description: Avbokad }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    Chaos:
      name: X-Chaos
      in: header
      description: Sätt till "off" för att stänga av chaos mode för ett enskilt anrop
      schema: { type: string, enum: ['off'] }
  responses:
    Problem:
      description: Fel enligt RFC 9457
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Unavailable:
      description: Tillfälligt fel från chaos mode
      headers: { Retry-After: { schema: { type: integer }, description: Sekunder att vänta } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    Event:
      type: object
      required: [id, name, venue, startsAt, saleStartsAt, capacity, confirmedSeats, freeSeats, waitlistedBookings]
      properties:
        id: { type: string, example: evt-1 }
        name: { type: string }
        venue: { type: string }
        startsAt: { type: string, format: date-time }
        saleStartsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        confirmedSeats: { type: integer }
        freeSeats: { type: integer }
        waitlistedBookings: { type: integer }
    EventList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Event' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    CreateBookingRequest:
      type: object
      required: [name, email, seats]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        seats: { type: integer, minimum: 1, maximum: 4 }
    Booking:
      type: object
      required: [id, eventId, name, email, seats, status, waitlistPosition, createdAt]
      properties:
        id: { type: string, example: bkg-1 }
        eventId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        seats: { type: integer, minimum: 1, maximum: 4 }
        status: { type: string, enum: [confirmed, waitlisted, cancelled] }
        waitlistPosition: { type: [integer, 'null'], description: Plats i väntelistan, annars null }
        createdAt: { type: string, format: date-time }
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - NOT_FOUND
            - SALE_NOT_STARTED
            - EVENT_STARTED
            - EMAIL_LIMIT_REACHED
            - CANCELLATION_CLOSED
            - ALREADY_CANCELLED
            - IDEMPOTENCY_KEY_REUSED
            - SERVICE_UNAVAILABLE
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Field errors, nyckel per fält
